name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-api-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: appraisal_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Replay migrations without automatic API grants
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: local-test-only
          PGDATABASE: appraisal_api_test
        run: python3 scripts/test-data-api-migrations.py

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Block critical dependency advisories
        run: npm audit --audit-level=critical

      - name: Lint source
        run: npm run lint

      - name: Run tests and accessibility checks
        run: npm run test:ci

      - name: Verify Worker runtime and admission limits
        run: npm run test:worker

      - name: Verify database health recovery and watchdog
        run: python3 -m unittest discover -s scripts -p 'test_database_health.py' -v

      - name: Build production bundle
        env:
          DISABLE_ESLINT_PLUGIN: "true"
        run: npm run build

      - name: Verify production shell
        run: npm run verify:build

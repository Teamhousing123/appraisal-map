name: Supabase health check
on:
  schedule:
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: supabase-health-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/database-health.yml
    secrets:
      SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
